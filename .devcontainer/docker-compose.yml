services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - VITE_PROXY_URL=http://deephaven-server:10000
    depends_on:
      deephaven-server:
        condition: service_healthy

  deephaven-server:
    image: ghcr.io/deephaven/server:${DHC_VERSION:-edge}
    pull_policy: always
    ports:
      - '15000:10000'
    environment:
      - START_OPTS=-Xmx4g -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler -Ddeephaven.console.type=python
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:10000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
