services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - VITE_PROXY_URL=http://deephaven-server:10000
    depends_on:
      deephaven-server:
        condition: service_healthy

  deephaven-server:
    image: ghcr.io/deephaven/server:${DHC_VERSION:-edge}
    pull_policy: always
    environment:
      - START_OPTS=-Xmx4g -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler -Ddeephaven.console.type=python
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:10000/jsapi/dh-core.js')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
